# L7 Ingress, handled by AKO and realised as a virtual service on NSX ALB.
#
# There is deliberately NO tls block here. The certificate is supplied by the
# HostRule in 30-hostrule.yaml, which references an object already imported on
# the Avi controller. A HostRule carrying an sslKeyCertificate converts an
# insecure host FQDN into a secure one on its own, so the Ingress does not need
# to declare TLS and no Kubernetes secret is required.
#
# If you switch the HostRule to sslKeyCertificate type "secret", add the block
# back:
#
#   tls:
#   - hosts:
#     - test.adpg.local
#     secretName: adpg-test
#
# Note that when both are present, the HostRule certificate takes precedence.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adpg-nginx
  namespace: adpg
spec:
  ingressClassName: avi-lb
  rules:
  - host: test.adpg.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adpg-nginx
            port:
              number: 80
