# HostRule: per-FQDN overrides applied to the Avi virtual service that AKO
# creates for this hostname.
#
# ---------------------------------------------------------------------------
# CERTIFICATE: this sample uses a certificate already imported on the
# controller. Choose ONE of the two forms below.
# ---------------------------------------------------------------------------
#
# type: ref  (used here)
#   Names a certificate object that must ALREADY exist on the Avi controller
#   under exactly this name, imported under
#   Templates > Security > SSL/TLS Certificates. No Kubernetes secret is
#   needed, and 20-ingress.yaml carries no tls block: a HostRule with an
#   sslKeyCertificate converts an insecure host FQDN to a secure one by itself.
#   If the named object does not exist, the HostRule is REJECTED.
#
#   Caution: the certificate served is whatever is in that controller object.
#   Verify its CN and SAN match the fqdn below. A mismatch is NOT visible from
#   Kubernetes -- the HostRule still reports Accepted while every browser
#   rejects the site. Nobody in the cluster can see this; someone has to own
#   checking it on the controller, and again at every renewal.
#
# type: secret  (alternative)
#   Names a Kubernetes TLS secret in this namespace, which AKO uploads to the
#   controller for you. The certificate is then versioned with your manifests
#   and there is no manual step on the controller. To use it, swap the block
#   below for the one here AND restore the tls block in 20-ingress.yaml:
#
#       tls:
#         sslKeyCertificate:
#           type: secret
#           name: adpg-test
#         termination: edge
#
#   Create the secret with:
#       kubectl -n adpg create secret tls adpg-test \
#         --cert=/path/to/test.adpg.local.crt \
#         --key=/path/to/test.adpg.local.key
# ---------------------------------------------------------------------------
apiVersion: ako.vmware.com/v1beta1
kind: HostRule
metadata:
  name: adpg-test
  namespace: adpg
spec:
  virtualhost:
    fqdn: test.adpg.local
    fqdnType: Exact
    enableVirtualHost: true
    tls:
      sslKeyCertificate:
        type: ref
        name: adpg-test
      sslProfile: System-Standard-PFS   
      termination: edge
    # Built-in Avi profile. AKO adds the :80 -> :443 redirect itself once the
    # host is secure.
    applicationProfile: System-Secure-HTTP
